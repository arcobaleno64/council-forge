name: Security Deep Scan (SAST)

# 業界 SAST 補強，補自製 regex 掃描的盲點：
#   - Bandit   : Python 專用 SAST（CWE 對應）。HIGH/HIGH 視為硬性失敗，其餘 advisory。
#   - Semgrep  : 規則式深度掃描（p/python + p/bandit registry），advisory，輸出 SARIF。
# 設計遵循 repo 既有「reporting-not-control，除非明確 gate」哲學：findings 一律寫入
# job summary 不靜默丟棄；只有「新出現的 HIGH 嚴重度且 HIGH 信心」才 fail-closed。
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # 每週一 07:00 UTC

permissions:
  contents: read

concurrency:
  group: security-deep-scan-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Bandit (pinned; bump periodically)
        run: python -m pip install bandit==1.8.0

      - name: Run Bandit (full report -> job summary; advisory)
        # 產出完整報告並附到 step summary（含 Low/Medium），不因 Low/Medium 失敗。
        run: |
          set -o pipefail
          python -m bandit -r artifacts/scripts -f txt -o bandit-report.txt || true
          {
            echo "## Bandit SAST report"
            echo '```'
            tail -c 60000 bandit-report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bandit gate (fail-closed on HIGH severity + HIGH confidence only)
        # 目前基線 HIGH=0。任何「新出現的 HIGH/HIGH」即阻斷，避免引入高風險模式。
        run: |
          python -m bandit -r artifacts/scripts -lll -iii -q -f json -o bandit-high.json || true
          python - <<'PY'
          import json, sys
          data = json.load(open("bandit-high.json", encoding="utf-8"))
          highs = [r for r in data.get("results", [])
                   if r.get("issue_severity") == "HIGH" and r.get("issue_confidence") == "HIGH"]
          if highs:
              print(f"[FAIL] {len(highs)} HIGH/HIGH Bandit finding(s):")
              for r in highs:
                  print(f"  - {r['test_id']} {r['filename']}:{r['line_number']} {r['issue_text']}")
              sys.exit(1)
          print("[OK] No HIGH/HIGH Bandit findings.")
          PY

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Semgrep (pinned; bump periodically)
        run: python -m pip install semgrep==1.167.0

      - name: Run Semgrep (advisory; registry rulesets -> SARIF + summary)
        # registry configs 需要網路（CI runner 有）。advisory：findings 寫入 summary，不阻斷。
        run: |
          set -o pipefail
          semgrep scan --config p/python --config p/bandit \
            --sarif --output semgrep.sarif artifacts/scripts || true
          semgrep scan --config p/python --config p/bandit \
            artifacts/scripts > semgrep.txt 2>&1 || true
          {
            echo "## Semgrep SAST report (advisory)"
            echo '```'
            tail -c 60000 semgrep.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  regex-safety:
    # Systemic ReDoS control: fail closed if any re.compile pattern has a
    # ReDoS-prone shape without a reviewed `# redos-ok:` justification. Prevents
    # a third catastrophic-backtracking regex from landing (root cause of
    # REDOS-01 / REDOS-02). Pure stdlib — no install step.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Regex-safety audit (fail-closed)
        run: python artifacts/scripts/regex_safety_audit.py --root .

  prompt-injection:
    # Indirect prompt-injection control for the agent orchestrator: research /
    # external captures and work-product artifacts are read by Claude/Gemini/Codex,
    # so injected instructions there are an attack surface (TASK-1021 Rule-3/4).
    # Two-tier, fail-closed: strict shapes (override / role / system-prompt exfil /
    # hidden Unicode / beacons) over the whole artifact surface; lexical shapes
    # additionally over the untrusted external-input zone. The detector's recall is
    # held by calibration against the labelled adversarial corpus. Pure stdlib.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Calibrate detector against adversarial corpus (fail-closed on any miss/FP)
        run: python artifacts/scripts/prompt_injection_scan.py calibrate --root .

      - name: Prompt-injection scan of artifact surface (fail-closed)
        run: python artifacts/scripts/prompt_injection_scan.py scan --root .
