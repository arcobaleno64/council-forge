name: Security Scan

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # Weekly (Mon 06:00 UTC). Catches the security.txt Expires silently lapsing — the gate
    # fails closed once Expires is in the past, even with no code change (TASK-1082).
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install pip-audit (pinned; bump periodically — see docs/templates/security/README.md)
        run: python -m pip install pip-audit==2.7.3

      - name: Run pip-audit (single enforcing step; no exit-masking)
        # pip-audit exits non-zero when a vulnerability is found AND still writes the
        # JSON report, so this one step both produces the artifact and fails the job.
        # Deliberately enforcing: a vulnerable dependency MUST fail this step.
        run: python -m pip_audit -r requirements.txt --format=json --output=pip-audit-report.json

  repo-secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Run repo secrets scan
        run: python artifacts/scripts/repo_security_scan.py --root . secrets

  repo-static-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Run focused static rules scan
        run: python artifacts/scripts/repo_security_scan.py --root . static

  python-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Python SAST (advisory) -> SARIF
        # repo_security_scan sast is ADVISORY (exit 0); it only PRODUCES the SARIF report.
        run: python artifacts/scripts/repo_security_scan.py --root . sast --format sarif > python-sast.sarif

      - name: SAST gate (advisory; durably surface findings to the job summary)
        # sast_gate is advisory by DEFAULT (exit 0) — findings do NOT fail the job, but are
        # durably appended to $GITHUB_STEP_SUMMARY so they are reviewable, not silently
        # dropped (the reporting-not-control guard). It still FAILS CLOSED on malformed /
        # unknown-version / unknown-level SARIF: we will not "advise" on a broken report.
        run: python artifacts/scripts/sast_gate.py --sarif python-sast.sarif --summary-file "$GITHUB_STEP_SUMMARY"

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Generate CycloneDX SBOM from a resolved environment
        # Generate from an INSTALLED (resolved) environment, not the unfrozen requirements
        # manifest, so transitive dependencies are captured by construction. cyclonedx-py is
        # a pure SBOM generator (no vuln scanning, no exit-code coupling); pinned like pip-audit.
        run: |
          python -m venv .sbom-venv
          .sbom-venv/bin/python -m pip install -r requirements.txt
          python -m pip install cyclonedx-bom==7.3.0
          python -m cyclonedx_py environment .sbom-venv --output-format JSON --output-file sbom.cdx.json

      - name: SBOM gate (well-formed + presence + direct-dependency identity)
        # Fails closed on malformed / unknown-version / version-skewed type / below
        # --min-components / a declared direct dependency missing from the SBOM (identity, not
        # just a count). The guard fails the job BEFORE the gate when a non-empty manifest
        # yields no names, so a parser failure cannot silently degrade to a count-only check.
        # An unmissable well-formed-not-complete advisory is printed: exhaustive transitive
        # completeness is an explicitly accepted risk (resolved-env recipe + advisory + audit).
        run: |
          REQ=$(python -c "import re;print(','.join(re.split(r'[<>=!~;\[ ]',l.strip())[0] for l in open('requirements.txt') if l.strip() and not l.lstrip().startswith(('#','-'))))")
          test -n "$REQ"
          python artifacts/scripts/sbom_gate.py --sbom sbom.cdx.json --min-components 1 --require-components "$REQ" --name-normalization pep503 --summary-file "$GITHUB_STEP_SUMMARY"

  security-txt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Validate RFC 9116 security.txt (fail-closed; present-only)
        # STEP-level conditional (after checkout): hashFiles is not available at a job-level
        # `if`, and a job-level `if` evaluates BEFORE checkout (the file is never there yet, so
        # it would always skip — including council-forge's own). At step level it sees the
        # checked-out tree: council-forge has .well-known/security.txt so the gate runs; a
        # downstream that copied template/ wholesale but has no security.txt skips it (no
        # failure). The gate fails closed on a malformed / expired security.txt.
        if: ${{ hashFiles('.well-known/security.txt') != '' }}
        run: python artifacts/scripts/security_txt_gate.py --file .well-known/security.txt

  release-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Verify release-manifest signature (native gpg; REAL cryptographic check)
        # The REAL cryptographic release-integrity check (map-don't-recreate: crypto is gpg's job,
        # not release_gate's — release_gate stays a stdlib STRUCTURAL gate). INDEPENDENT of the
        # structural gates below, keyed ONLY on the source-repo sentinel (always runs in
        # council-forge, cleanly skips downstream). Provision-state is decided INSIDE bash, NOT in
        # the `if`: keying the `if` on the .asc/pubkey would let deleting a signature SKIP
        # enforcement once signing is provisioned (a fail-open). Here enforcement is ARMED as soon
        # as ANY member of the signing triad (pinned fingerprint / detached signature / public key)
        # is present, and a missing member then FAILS CLOSED. (codex impl-review)
        if: ${{ hashFiles('.council-forge-source-repo') != '' }}
        env:
          # The operator pins the fingerprint they published OUT-OF-BAND here. Same-repo pinning
          # only proves repo integrity; true publisher trust needs the fingerprint from an
          # independent channel — see docs/security/release-signing.md for the honest residual.
          EXPECTED_SIGNING_FINGERPRINT: ""
        shell: bash
        run: |
          set -eo pipefail                          # explicit: do NOT rely on the runner default
          SIG=.well-known/release-manifest.json.asc
          PUB=.well-known/release-signing.pub
          # The signing TRIAD: pinned fingerprint + detached signature + published public key.
          # Count how many are present to decide armed-vs-unprovisioned.
          present=0
          if [ -n "$EXPECTED_SIGNING_FINGERPRINT" ]; then present=$((present + 1)); fi
          if [ -f "$SIG" ]; then present=$((present + 1)); fi
          if [ -f "$PUB" ]; then present=$((present + 1)); fi
          if [ "$present" -eq 0 ]; then
            echo "release signing not provisioned (no pin/.asc/pubkey) — skipping signature verify; the structural gates below still enforce manifest integrity"
            exit 0
          fi
          # ARMED: at least one member of the triad is present, so ALL must be present + valid or we
          # FAIL CLOSED. Removing a signature/pubkey (or unsetting the pin) after provisioning can
          # therefore NOT silently disable cryptographic enforcement. (codex impl-review)
          test -n "$EXPECTED_SIGNING_FINGERPRINT"
          test -f "$SIG"
          test -f "$PUB"
          # Normalize case + STRICTLY validate the pin as a full 40-hex fingerprint — fail closed on
          # a weak/mistyped/REGEX-METACHARACTER pin (".*", "0", a short key-id) that a substring
          # match would let accept ANY valid signature. The pin is then a FIXED STRING, never a regex.
          EXPECTED_SIGNING_FINGERPRINT="$(printf '%s' "$EXPECTED_SIGNING_FINGERPRINT" | tr 'a-f' 'A-F')"
          printf '%s' "$EXPECTED_SIGNING_FINGERPRINT" | grep -Eq '^[0-9A-F]{40}$'
          export GNUPGHOME="$(mktemp -d)"           # isolated keyring (no ambient trust)
          gpg --batch --import "$PUB"
          # CAPTURE-then-check (NOT a pipe into the matcher): the gpg return code is checked DIRECTLY
          # at the assignment under set -e (a non-zero gpg -> failed command substitution -> the step
          # fails), so a degraded/bad signature cannot be masked by a status stream that merely
          # contains a matching VALIDSIG line.
          STATUS="$(gpg --batch --status-fd 1 --verify "$SIG" .well-known/release-manifest.json)"
          # Bind to the PINNED SIGNER by EXACT FIELD EQUALITY, not a substring/regex match: require the
          # pinned fingerprint to equal the signing-key field ($3) or the primary-key field ($NF) of
          # the VALIDSIG line. gpg --verify exits 0 on ANY good signature from ANY imported key (e.g.
          # an attacker key appended to the bundle), so this exact signer binding rejects substitution.
          printf '%s\n' "$STATUS" | awk -v want="$EXPECTED_SIGNING_FINGERPRINT" '$1=="[GNUPG:]" && $2=="VALIDSIG" && ($3==want || $NF==want){ok=1} END{exit(ok?0:1)}'

      - name: Verify published release manifest matches the template snapshot (HEAD consistency)
        # STEP-level guard keyed on the SOURCE-REPO IDENTITY sentinel: only council-forge (the
        # source template repo) carries .council-forge-source-repo — a downstream terminal repo
        # is contractually FORBIDDEN from it (guard_contract_validator), and it is never
        # propagated (not in template/). So this runs ONLY in council-forge and cleanly skips
        # downstream, even if a downstream coincidentally carries an unrelated
        # snapshot_manifest.py. Keying on the manifest itself would MASK a missing-manifest
        # regression as a skip; here a missing/mismatched manifest FAILS the job (required
        # evidence: snapshot_manifest verify exits non-zero), no exit-masking.
        if: ${{ hashFiles('.council-forge-source-repo') != '' }}
        run: python artifacts/scripts/snapshot_manifest.py verify --template-root template --manifest .well-known/release-manifest.json

      - name: Release integrity gate (structural; checksums manifest)
        # Fails closed on malformed / schema-drift / bad-digest shape / placeholder / coverage
        # gap. An unmissable STRUCTURE-not-crypto advisory is appended to $GITHUB_STEP_SUMMARY:
        # real cryptographic verification (cosign / gh attestation verify / minisign -V) is a
        # separate native-tool step and an explicitly accepted residual risk.
        if: ${{ hashFiles('.council-forge-source-repo') != '' }}
        run: python artifacts/scripts/release_gate.py --format checksums --file .well-known/release-manifest.json --summary-file "$GITHUB_STEP_SUMMARY"
