name: Weekly Council Audit

on:
  schedule:
    - cron: '0 18 * * 0'  # Sunday 18:00 UTC = Monday 02:00 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-council-audit-${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  council-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 8

      - name: Install Codex CLI
        run: |
          # CI-03: pin to an exact version instead of the floating @latest. This
          # job runs the installed CLI with contents:write and OPENAI_API_KEY, so a
          # malicious/compromised @latest publish would run with those privileges.
          # Bump this pin deliberately after reviewing upstream release notes.
          npm install -g @openai/codex@0.142.3
          CODEX_BIN="$(command -v codex)"
          if [ -z "$CODEX_BIN" ]; then
            echo "::error::codex binary not found on PATH after npm install"
            exit 1
          fi
          # Invoke-CodexAgent.ps1 hardcodes its default Executable to 'codex.cmd'
          # (Windows convention). Provide a sibling symlink on Linux so the
          # wrapper resolves the binary via PATH unchanged.
          sudo ln -sf "$CODEX_BIN" "$(dirname "$CODEX_BIN")/codex.cmd"
          codex --version
          codex.cmd --version

      - name: Resolve commit range
        id: range
        run: |
          OLDEST="$(git rev-parse --short HEAD~7)"
          NEWEST="$(git rev-parse --short HEAD)"
          NEWEST_FULL="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="claude/weekly-audit-$DATE"
          {
            echo "oldest=$OLDEST"
            echo "newest=$NEWEST"
            echo "newest_full=$NEWEST_FULL"
            echo "date=$DATE"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Run council review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true
        run: |
          mkdir -p "artifacts/reviews/weekly-${{ steps.range.outputs.date }}"
          # Wrapper -DiffSource enum (Invoke-CodexReview.ps1:96-101) supports
          # staged | unstaged | all | HEAD only; no native 7-commit window.
          # Soft-reset 7 commits so the index reflects HEAD~7..HEAD, then call
          # -DiffSource staged. CI is ephemeral so the reset is local and we
          # restore HEAD before the commit step.
          git reset --soft HEAD~7
          pwsh -NoProfile -File artifacts/scripts/Invoke-CodexReview.ps1 \
            -DiffSource staged \
            -OutputDir "artifacts/reviews/weekly-${{ steps.range.outputs.date }}/"
          git reset --hard "${{ steps.range.outputs.newest_full }}"

      - name: Commit and push review
        id: commit
        run: |
          git config user.name "claude-routine[bot]"
          git config user.email "claude-routine@users.noreply.github.com"
          git checkout -b "${{ steps.range.outputs.branch }}"
          git add artifacts/reviews/
          if git diff --cached --quiet; then
            echo "No review artifacts produced; skipping commit and PR."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "[claude-routine] weekly-audit: ${{ steps.range.outputs.oldest }}..${{ steps.range.outputs.newest }}"
          git push origin "${{ steps.range.outputs.branch }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.commit.outputs.pushed == 'true'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const branch = '${{ steps.range.outputs.branch }}';
            const date = '${{ steps.range.outputs.date }}';
            const range = '${{ steps.range.outputs.oldest }}..${{ steps.range.outputs.newest }}';
            const body = [
              '> **Generated by Codex Council Review (GitHub Actions)**',
              '> Source workflow: `.github/workflows/weekly-council-audit.yml`',
              '> Source script: `artifacts/scripts/Invoke-CodexReview.ps1`',
              `> Run window: ${range}`,
              '',
              'Council members reviewed the past 7 commits as a combined diff across three Codex tiers (gpt-5.4-mini / gpt-5.4 / gpt-5.5). See attached review artifact under `artifacts/reviews/weekly-' + date + '/` for triage.'
            ].join('\n');
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: 'master',
              title: `[claude-routine] Weekly Audit ${date} (${range})`,
              body: body
            });
            core.info(`Created PR #${pr.data.number} for ${branch}`);
