name: Workflow Guards

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: workflow-guards-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        # cyclonedx-bom is pinned so the SBOM transitive-generation regression test runs
        # (not skipped) in CI, exercising the real generation path, not just the gate parser.
        run: pip install -r requirements.txt pytest pytest-cov cyclonedx-bom==7.3.0

      - name: Unit Tests
        run: |
          python -m pytest artifacts/scripts/test_guard_units.py artifacts/scripts/test_security_scans.py artifacts/scripts/test_scaffold_downstream.py artifacts/scripts/test_prompt_regression_validator.py artifacts/scripts/test_drift_dashboard.py artifacts/scripts/test_propagate_downstream.py artifacts/scripts/test_ssdf_mapping_validator.py artifacts/scripts/test_sca_gate.py artifacts/scripts/test_sast_gate.py artifacts/scripts/test_sbom_gate.py artifacts/scripts/test_security_txt_gate.py artifacts/scripts/test_release_gate.py artifacts/scripts/test_snapshot_manifest.py artifacts/scripts/test_repo_security_scan_sast.py artifacts/scripts/test_downstream_security_template.py artifacts/scripts/test_release_signing.py artifacts/scripts/test_ssdf_conformance_dashboard.py artifacts/scripts/test_standards_backaudit_dashboard.py artifacts/scripts/test_publish_release_verify.py -v \
            --cov --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=html:coverage-report \
            --cov-fail-under=90

      - name: SSDF Mapping Integrity
        # errexit-safe: validator exit 3 (valid-with-open-items) is acceptable; only an
        # integrity violation (2) or usage/IO error (1) fails the gate. Without `set +e`
        # the default errexit would abort the step on exit 3 before rc is captured.
        run: |
          set +e
          python artifacts/scripts/ssdf_mapping_validator.py --mapping docs/ssdf-mapping.md
          rc=$?
          set -e
          case "$rc" in 0|3) exit 0;; *) exit "$rc";; esac

      - name: Contract Guard
        run: python artifacts/scripts/guard_contract_validator.py --root .

      - name: Prompt Regression
        run: python artifacts/scripts/prompt_regression_validator.py --root .

      - name: Status Guard (all tasks)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          failed=0
          for status_file in artifacts/status/TASK-*.status.json; do
            task_id=$(basename "$status_file" .status.json)
            echo "--- Validating $task_id ---"
            if ! python artifacts/scripts/guard_status_validator.py --task-id "$task_id"; then
              failed=1
            fi
          done
          exit $failed

      - name: Red Team Static Phase
        run: python artifacts/scripts/run_red_team_suite.py --phase static

      - name: Context Stack Validation
        run: python artifacts/scripts/validate_context_stack.py --root .

      - name: Repo Health Dashboard
        run: python artifacts/scripts/repo_health_dashboard.py --root .
