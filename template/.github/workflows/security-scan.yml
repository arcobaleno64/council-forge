name: Security Scan

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install pip-audit (pinned; bump periodically — see docs/templates/security/README.md)
        run: python -m pip install pip-audit==2.7.3

      - name: Run pip-audit (single enforcing step; no exit-masking)
        # pip-audit exits non-zero when a vulnerability is found AND still writes the
        # JSON report, so this one step both produces the artifact and fails the job.
        # Deliberately enforcing: a vulnerable dependency MUST fail this step.
        run: python -m pip_audit -r requirements.txt --format=json --output=pip-audit-report.json

  repo-secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Run repo secrets scan
        run: python artifacts/scripts/repo_security_scan.py --root . secrets

  repo-static-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Run focused static rules scan
        run: python artifacts/scripts/repo_security_scan.py --root . static

  python-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Python SAST (advisory) -> SARIF
        # repo_security_scan sast is ADVISORY (exit 0); it only PRODUCES the SARIF report.
        run: python artifacts/scripts/repo_security_scan.py --root . sast --format sarif > python-sast.sarif

      - name: SAST gate (advisory; durably surface findings to the job summary)
        # sast_gate is advisory by DEFAULT (exit 0) — findings do NOT fail the job, but are
        # durably appended to $GITHUB_STEP_SUMMARY so they are reviewable, not silently
        # dropped (the reporting-not-control guard). It still FAILS CLOSED on malformed /
        # unknown-version / unknown-level SARIF: we will not "advise" on a broken report.
        run: python artifacts/scripts/sast_gate.py --sarif python-sast.sarif --summary-file "$GITHUB_STEP_SUMMARY"
